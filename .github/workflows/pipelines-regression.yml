name: Dystopic regression

on:
  pull_request:
    # ready_for_review is NOT a default event type — without it, a check that
    # skipped while the PR was a draft hangs "expected" forever after the PR
    # flips to ready.
    types: [opened, synchronize, reopened, ready_for_review]
  # Gate pushes to main in head-only (absolute gate) mode:
  # push:
  #   branches: [main]

permissions:
  contents: read
  checks: write
  # For the sticky PR comment with the per-seed regression report. Omitting
  # it doesn't fail the check — the comment is just silently skipped.
  pull-requests: write

concurrency:
  group: pipelines-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    env:
      # Staging control plane. The published BuildPipelines/pipelines-regression
      # marketplace action isn't available yet, so this job inlines what the
      # action does: install the CLI and call `odyssey ci review`. The platform
      # resolves the execution recipe, gate, and bound CI suite from the
      # connected umbrella agent — nothing else is configured here.
      DYSTOPIC_BASE_URL: https://api-staging.dystopic.ai
      DYSTOPIC_API_KEY: ${{ secrets.DYSTOPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Both the PR's merge-base and head commits must be present locally so
          # the merge-base can be derived (stable per PR across base churn).
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dystopic CLI
        # `odyssey ci review` needs only the base client + cli extra; the agent
        # server extras (fastapi, etc.) aren't needed — CI runs the agent on the
        # platform, not here. Deps come from PyPI; dystopic itself (--no-deps)
        # from TestPyPI, which avoids TestPyPI's broken fastapi sdist.
        run: |
          python -m pip install --upgrade pip
          pip install "httpx<1.0,>=0.27" "keyring>=24" "python-dotenv>=1.0" \
            "pyyaml>=6" "questionary>=2.0" "rich>=13.8" "pydantic>=2.0" \
            "typing-extensions>=4.7"
          pip install dystopic==0.12.4 --no-deps --index-url https://test.pypi.org/simple/
          odyssey ci review --help >/dev/null

      - name: Derive merge-base
        id: mb
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          MB="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          echo "merge_base=$MB" >> "$GITHUB_OUTPUT"
          echo "Derived merge-base $MB (base tip $BASE_SHA, head $HEAD_SHA)"

      - name: Dystopic CI review
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Exit 1 => gate blocked (red), 0 => pass/neutral/advisory, 2 => usage.
          # The platform posts the branded check + sticky report asynchronously;
          # this job's own status is what branch protection should require.
          odyssey ci review \
            --repo "${{ github.repository }}" \
            --base "${{ steps.mb.outputs.merge_base }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --pr-number "$PR_NUMBER"
